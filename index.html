<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학생 활동 확인 · 기재안 검토</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#1b2430; --sub:#5b6573; --line:#e3e7ee; --soft:#f7f9fc;
  --pri:#1f4e79; --pri2:#2c6aa3; --priSoft:#e8f0f9;
  --ok:#17803d; --okSoft:#e6f5ec; --warn:#b45309; --warnSoft:#fdf3e2; --bad:#b42318; --badSoft:#fdecea;
  --a-auto:#2563eb; --a-club:#7c3aed; --a-career:#d97706; --a-behavior:#0f766e; --a-etc:#6b7280;
  --r:12px; --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri2)}
.hide{display:none!important}
.muted{color:var(--sub)} .small{font-size:13px} .xs{font-size:12px} .b{font-weight:700} .nowrap{white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .grow{flex:1 1 auto} .right{margin-left:auto}
.stack>*+*{margin-top:12px}
/* 상단바 */
.topbar{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.topbar .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.topbar .title{font-weight:700;font-size:16px;letter-spacing:-.2px}
.topbar .school{font-size:12px;opacity:.8}
.topbar .user{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
.topbar .user .who{background:rgba(255,255,255,.14);padding:4px 10px;border-radius:99px;white-space:nowrap}
.topbar .tbtn{white-space:nowrap;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
.topbar .tbtn:hover{background:rgba(255,255,255,.12)}
.busy{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;visibility:hidden}
.busy.on{visibility:visible}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
/* 탭 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--sub);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tab.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:700}
.tab .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:99px;background:var(--line);color:var(--ink);font-size:12px;line-height:18px;text-align:center}
.tab .cnt.alert{background:var(--bad);color:#fff}
/* 카드/버튼 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card h2{margin:0 0 4px;font-size:18px} .card h3{margin:0;font-size:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff} .btn.primary:hover{background:var(--pri2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:#f2c4bf} .btn.danger:hover{background:var(--badSoft)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent} .btn.ghost:hover{background:var(--soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--line);color:var(--ink)}
.badge.area-auto{background:#e7efff;color:var(--a-auto)} .badge.area-club{background:#f1eaff;color:var(--a-club)}
.badge.area-career{background:#fff2df;color:var(--a-career)} .badge.area-personal{background:#fde8f1;color:#be185d} .badge.area-behavior{background:#e3f4f1;color:var(--a-behavior)} .badge.area-etc{background:#eef0f3;color:var(--a-etc)}
.badge.ok{background:var(--okSoft);color:var(--ok)} .badge.warn{background:var(--warnSoft);color:var(--warn)} .badge.bad{background:var(--badSoft);color:var(--bad)} .badge.pri{background:var(--priSoft);color:var(--pri)}
.status{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.st-none{background:#eef0f3;color:#6b7280} .st-작성중{background:#eef0f3;color:#475467} .st-검토요청{background:#e7efff;color:#1d4ed8}
.st-수정요청{background:var(--warnSoft);color:var(--warn)} .st-학생확인{background:#e0f2fe;color:#0369a1} .st-최종확정{background:var(--okSoft);color:var(--ok)}
/* 폼 */
label.f{display:block;font-size:13px;color:var(--sub);margin:0 0 4px;font-weight:500}
.inp,select.inp,textarea.inp{width:100%;border:1px solid #cfd6e0;border-radius:9px;padding:9px 11px;background:#fff;outline:none}
.inp:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(44,106,163,.15)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.hint{font-size:12.5px;color:var(--sub);margin-top:4px}
.err{color:var(--bad);font-size:13px}
.note{background:var(--priSoft);border:1px solid #cfe0f3;color:#1d3d5f;border-radius:10px;padding:10px 12px;font-size:13.5px}
.note.warn{background:var(--warnSoft);border-color:#f3d9ab;color:#7a3e05}
/* 로그인 */
.login{max-width:420px;margin:40px auto;padding:0 16px}
.login .card{padding:24px}
.login h1{font-size:20px;margin:0 0 2px}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;margin:16px 0}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px;cursor:pointer;font-weight:500;color:var(--sub)}
.seg button.on{background:#fff;color:var(--pri);font-weight:700;box-shadow:var(--sh)}
/* 학생: 활동 카드 */
.sumbar{display:flex;gap:10px;flex-wrap:wrap}
.sum{flex:1 1 140px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.sum .k{font-size:12px;color:var(--sub)} .sum .v{font-size:20px;font-weight:700}
.area-sec{margin-top:18px}
.area-sec>.hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.area-sec>.hd h3{margin:0;font-size:16px}
.act{background:#fff;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.act.ok{border-left-color:var(--ok)} .act.issue{border-left-color:var(--warn)}
.act .t{font-weight:700} .act .m{font-size:12.5px;color:var(--sub)}
.act .common{background:var(--soft);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13.5px;color:#344054}
.act .mine{margin-top:8px;font-size:14px;white-space:pre-wrap}
.act .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tog{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.tog.on-ok{background:var(--okSoft);border-color:#9fd6b2;color:var(--ok);font-weight:700}
.tog.on-issue{background:var(--warnSoft);border-color:#f0c784;color:var(--warn);font-weight:700}
.tog.on-star{background:#fff7d6;border-color:#f2d36b;color:#8a6100;font-weight:700}
.act .notebox{margin-top:8px}
/* 기재안 */
.draft{margin-bottom:16px}
.draft .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.draft-text{background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:12px 14px;white-space:pre-wrap;line-height:1.75;font-size:15px}
.draft-text.final{background:#f3fbf6;border-color:#bfe3cb}
.meter{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);margin-top:6px;flex-wrap:wrap}
.meter .bar{flex:1 1 120px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:80px}
.meter .bar i{display:block;height:100%;background:var(--pri2)}
.meter.over .bar i{background:var(--bad)} .meter.over{color:var(--bad);font-weight:700}
.diff{white-space:pre-wrap;line-height:1.8;background:#fff;border:1px dashed #cfd6e0;border-radius:10px;padding:10px 12px;font-size:14px}
.diff del{background:#fde2e1;color:#9b1c1c;text-decoration:line-through}
.diff ins{background:#dcf5e3;color:#14532d;text-decoration:none}
.thread{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.cmt{display:flex;gap:8px;margin:8px 0}
.cmt .bub{border-radius:12px;padding:8px 12px;max-width:85%;font-size:14px;white-space:pre-wrap}
.cmt.student .bub{background:#fff7e8;border:1px solid #f3dcae}
.cmt.teacher{justify-content:flex-end} .cmt.teacher .bub{background:var(--priSoft);border:1px solid #cfe0f3}
.cmt.system{justify-content:center} .cmt.system .bub{background:transparent;color:var(--sub);font-size:12.5px;padding:2px 8px}
.cmt .meta{font-size:11.5px;color:var(--sub);margin-top:2px}
.cmt.resolved .bub{opacity:.65}
/* 교사 표 */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--soft);font-weight:700;color:#344054;position:sticky;top:0;z-index:1;white-space:nowrap}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:#f5f9ff}
table.t td.c,table.t th.c{text-align:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#d0d5dd;vertical-align:middle}
.dot.작성중{background:#98a2b3}.dot.검토요청{background:#3b82f6}.dot.수정요청{background:#f59e0b}.dot.학생확인{background:#0ea5e9}.dot.최종확정{background:#16a34a}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--sub)}
/* 상세 2단 */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
@media (max-width:980px){.two{grid-template-columns:1fr}}
.side-act{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13.5px}
.side-act .t{font-weight:700}
.vlist{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.vlist .v{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px;background:#fff}
.vlist .v:last-child{border-bottom:0}
/* 업로드 */
.drop{display:block;border:2px dashed #b9c5d6;border-radius:14px;padding:26px;text-align:center;background:#fbfcfe;cursor:pointer}
.drop.over{background:var(--priSoft);border-color:var(--pri2)}
.paste{min-height:90px;border:1px solid #cfd6e0;border-radius:10px;padding:10px;background:#fff;overflow:auto;max-height:240px;font-size:13px}
.paste:empty:before{content:attr(data-ph);color:#98a2b3}
.cand{margin-top:16px}
.cand.off{opacity:.55}
.cand .rows{max-height:460px;overflow:auto;margin-top:10px}
.cand textarea.inp{min-height:52px;font-size:13px;padding:6px 8px}
.st-ok{color:var(--ok)} .st-warn{color:var(--warn)} .st-bad{color:var(--bad)} .st-mute{color:#98a2b3}
.colchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
/* 모달 */
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
.modal{background:#fff;border-radius:14px;max-width:520px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:860px}
.modal-head{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:16px}
.modal-head .x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:var(--sub);line-height:1}
.modal-body{padding:16px;max-height:70vh;overflow:auto}
.modal-err{color:var(--bad);font-size:13px;padding:0 16px 8px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.temp-pw{font-size:28px;font-weight:700;letter-spacing:4px;text-align:center;background:var(--soft);border-radius:10px;padding:14px;margin:8px 0;font-family:ui-monospace,Menlo,Consolas,monospace}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast .m{background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
#toast .m.err{background:var(--bad)} #toast .m.ok{background:var(--ok)}
.empty{text-align:center;color:var(--sub);padding:28px 10px}
.demo-bar{background:#fff7d6;border-bottom:1px solid #f2d36b;color:#6b4e00;font-size:13px}
.demo-bar .in{max-width:1180px;margin:0 auto;padding:7px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:640px){
  .topbar .school{display:none} .topbar .title{font-size:14px} .topbar .user .who{display:none} .topbar .in{padding:8px 12px}
  .demo-bar .in{font-size:12px}
  .wrap{padding:12px} .card{padding:14px}
  table.t{font-size:12.5px} table.t th,table.t td{padding:6px 7px}
}

</style>

<script>
/* ===================== 순수 로직: 글자수 · 비교 · 문서 대조 ===================== */
/*PURE-START*/
var AK = (function () {
  'use strict';

  function str(v) { return v == null ? '' : String(v); }
  function normCell(s) {
    return str(s).replace(/[​﻿­]/g, '')
      .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/ /g, ' ').replace(/[ \t\r\n]+/g, ' ').trim();
  }

  function n(v) { var d = str(v).replace(/[^0-9]/g, ''); return d ? String(parseInt(d, 10)) : ''; }

  // ── 글자수 / 나이스 바이트 ──
  function charCount(s) { return Array.from(str(s).replace(/\r\n?/g, '\n')).length; }
  function neisBytes(s) {
    var b = 0;
    Array.from(str(s).replace(/\r\n?/g, '\n')).forEach(function (ch) {
      var c = ch.codePointAt(0);
      if (ch === '\n') b += 2; else if (c <= 0x7f) b += 1; else b += 3;
    });

  }

  // ── 단어 단위 비교(diff) ──
  function tokenize(s) { return str(s).match(/\s+|[^\s]+/g) || []; }
  function diff(a, b) {
    var A = tokenize(a), B = tokenize(b), N = A.length, M = B.length;
    if (N * M > 4000000) return [{ t: '-', s: str(a) }, { t: '+', s: str(b) }];
    var W = M + 1, dp = new Uint32Array((N + 1) * W);
    for (var i = N - 1; i >= 0; i--) for (var j = M - 1; j >= 0; j--)
      dp[i * W + j] = A[i] === B[j] ? dp[(i + 1) * W + j + 1] + 1 : Math.max(dp[(i + 1) * W + j], dp[i * W + j + 1]);
    var out = [], x = 0, y = 0;
    function push(t, s) { var last = out[out.length - 1]; if (last && last.t === t) last.s += s; else out.push({ t: t, s: s }); }
    while (x < N && y < M) {

      else if (dp[(x + 1) * W + y] >= dp[x * W + y + 1]) { push('-', A[x]); x++; }
      else { push('+', B[y]); y++; }

    while (x < N) push('-', A[x++]);
    while (y < M) push('+', B[y++]);
    return out;
  }

  // ── 날짜 정규화(명렬표) ──
  function normBirth(v) {
    var s = str(v).trim();
    if (!s) return '';
    var m;
    if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) return m[1] + m[2] + m[3];
    if ((m = s.match(/^(\d{2})(\d{2})(\d{2})$/))) return (parseInt(m[1], 10) > 40 ? '19' : '20') + m[1] + m[2] + m[3];
    if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))) { var yy = m[3].length === 2 ? (parseInt(m[3], 10) > 40 ? '19' : '20') + m[3] : m[3]; return yy + ('0' + m[1]).slice(-2) + ('0' + m[2]).slice(-2); }
    if ((m = s.match(/(\d{2,4})\D+(\d{1,2})\D+(\d{1,2})/))) { var y = m[1]; if (y.length === 2) y = (parseInt(y, 10) > 40 ? '19' : '20') + y; return y + ('0' + m[2]).slice(-2) + ('0' + m[3]).slice(-2); }

  }
  function normPhone(v) { var d = str(v).replace(/\D/g, ''); if (d.length === 10 && d[0] === '1') d = '0' + d; return d; }

  // ── 문서 → 블록 ──
  // block = { kind: 'table'|'text', label, rows: [[cell, ...], ...] }
  function htmlToBlocks(html, DOMParserCtor) {
    var P = DOMParserCtor || DOMParser;
    var doc = new P().parseFromString('<!DOCTYPE html><html><body>' + html + '</body></html>', 'text/html');
    var blocks = [], lines = [];
    function flush() { if (lines.length) { blocks.push({ kind: 'text', rows: lines.map(function (l) { return [l]; }) }); lines = []; } }
    function tableRows(tb) {
      var rows = [];
      Array.prototype.forEach.call(tb.rows || [], function (tr) {
        var r = [];
        Array.prototype.forEach.call(tr.cells, function (td) {
          var t = normCell(td.textContent);
          r.push(t);
          var span = parseInt(td.getAttribute('colspan') || '1', 10);

        });

      });

    }
    var BLOCK = /^(P|DIV|LI|H[1-6]|BLOCKQUOTE|PRE|SECTION|ARTICLE|UL|OL|DL|DT|DD|HEADER|FOOTER|CENTER)$/;
    function walk(node) {
      Array.prototype.forEach.call(node.childNodes, function (ch) {
        if (ch.nodeType === 3) { var t = normCell(ch.textContent); if (t) lines.push(t); return; }
        if (ch.nodeType !== 1) return;

        catch (e) { throw new Error('서버 응답을 읽지 못했습니다. Apps Script를 [배포 관리 → 수정 → 새 버전]으로 다시 배포했는지 확인하세요.'); }
      });
    }, function () { throw new Error('서버에 연결하지 못했습니다. 인터넷 연결이나 웹앱 주소(API_URL)를 확인하세요.'); });
  }
  return Promise.reject(new Error('서버 주소가 설정되지 않았습니다. index.html 맨 위의 API_URL을 확인하세요.'));
}
function call(action, data) {
  setBusy(1);
  return rawCall({ action: action, token: S.token, data: data || {} }).then(function (res) {
    setBusy(-1);
    if (!res) throw new Error('서버 응답이 없습니다.');
    if (res.ok) return res.data;
    if (res.code === 'AUTH') { expire(res.error); throw Object.assign(new Error(res.error), { silent: true }); }
    if (res.code === 'MUSTCHANGE') { S.user && (S.user.mustChange = true); S.view = 'mustChange'; render(); throw Object.assign(new Error(res.error), { silent: true }); }
    throw new Error(res.error || '오류가 발생했습니다.');
  }, function (err) { setBusy(-1); throw err; });
}
function fail(e) { if (e && e.silent) return; toast((e && e.message) || String(e), 'err'); }

function expire(msg) {
  S.token = null; S.user = null; store('ak_token', null);
  S.view = 'login'; render();
  toast(msg || '로그인이 만료되었습니다.', 'err');
}

function toast(msg, type) {
  var root = $('#toast');
  var el = document.createElement('div');
  el.className = 'm ' + (type || '');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(function () { el.remove(); }, type === 'err' ? 5200 : 2800);
}

function collect(root) {
  var o = {};
  $$('[name]', root).forEach(function (el) {
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
    else o[el.name] = el.value;
  });
  return o;
}

/** 대화상자: buttons [{label, value, primary, danger}], onOk(form, value, el) → 오류문구 반환 시 유지 */
function openModal(opts) {
  return new Promise(function (resolve) {
    var root = $('#modal-root');
    var wrap = document.createElement('div');
    wrap.className = 'modal-back';
    var buttons = opts.buttons || [{ label: '닫기', value: null }];
    wrap.innerHTML = '<div class="modal ' + (opts.wide ? 'wide' : '') + '" role="dialog" aria-modal="true"><div class="modal-head"><h3>' + esc(opts.title || '') + '</h3><button class="x" data-mclose aria-label="닫기">×</button></div>'
      + '<div class="modal-body">' + (opts.body || '') + '</div><div class="modal-err"></div><div class="modal-foot">'
      + buttons.map(function (b, i) { return '<button class="btn ' + (b.primary ? 'primary' : '') + (b.danger ? ' danger' : '') + '" data-mbtn="' + i + '">' + esc(b.label) + '</button>'; }).join('')
      + '</div></div>';
    root.appendChild(wrap);
    var close = function (v) { wrap.remove(); resolve(v); };
    wrap.addEventListener('click', function (e) {
      if (e.target.closest('[data-mclose]')) return close({ value: null, form: collect(wrap) });
      var b = e.target.closest('[data-mbtn]');
      if (!b) { if (opts.onClick) opts.onClick(e, wrap); return; }
      var def = buttons[+b.dataset.mbtn];
      var form = collect(wrap);
      if (def.value && opts.onOk) {
        $$('.modal-foot button', wrap).forEach(function (x) { x.disabled = true; });
        Promise.resolve(opts.onOk(form, def.value, wrap)).then(function (err) {
          $$('.modal-foot button', wrap).forEach(function (x) { x.disabled = false; });
          if (err) { $('.modal-err', wrap).textContent = err; return; }
          close({ value: def.value, form: form });
        }, function (e2) {
          $$('.modal-foot button', wrap).forEach(function (x) { x.disabled = false; });
          if (!(e2 && e2.silent)) $('.modal-err', wrap).textContent = (e2 && e2.message) || String(e2);
        });
        return;
      }
      close({ value: def.value, form: form });
    });
    if (opts.onOpen) opts.onOpen(wrap);
    var first = $('input,textarea,select', wrap);
    if (first && opts.focus !== false) setTimeout(function () { first.focus(); }, 30);
  });
}

}

function meter(text, limit) {

function pwRuleError(pw) {
  pw = String(pw || '');
  if (/\s/.test(pw)) return '비밀번호에는 띄어쓰기를 쓸 수 없어요.';
  if (pw.length < 6) return '비밀번호는 6자 이상이어야 해요.';
  if (!/[^A-Za-z0-9가-힣ㄱ-ㅎㅏ-ㅣ]/.test(pw)) return '특수문자(! @ # $ % 등)를 1개 이상 넣어 주세요.';
  if (!/[A-Za-z0-9가-힣]/.test(pw)) return '영문이나 숫자를 함께 넣어 주세요.';
  return '';
}

  call('studentHome').then(function (r) {

    // 등록된 활동이 하나도 없으면 학교 활동 목록부터 보여 주기
    if (!r.activities.length && !load('ak_stab')) S.stab = 'school';
    render();
  }).catch(fail);
  render();
}

function viewStudent() {
  var d = S.home;
  if (!d) return '<div class="wrap"><div class="empty">불러오는 중…</div></div>';
  var st = d.student, acts = d.activities;
  var total = acts.length, ok = acts.filter(function (a) { return a.check === 'ok'; }).length, issue = acts.filter(function (a) { return a.check === 'issue'; }).length;
  var sel = acts.filter(function (a) { return a.select; }).length;
  var pendingDrafts = draftAreas().filter(function (a) { var x = d.drafts[a.key]; return x && x.pubV > 0 && (x.status === '검토요청'); }).length;
  var cat = d.catalog || [];
  var notJoined = cat.filter(function (p) { return !p.joined && !(p.report && p.report.status === '대기'); }).length;
  var tabs = '<div class="tabs"><button class="tab ' + (S.stab === 'acts' ? 'on' : '') + '" data-act="stab" data-v="acts">내 활동 확인<span class="cnt">' + total + '</span></button>'
    + '<button class="tab ' + (S.stab === 'school' ? 'on' : '') + '" data-act="stab" data-v="school">학교 활동 목록<span class="cnt">' + cat.filter(function (p) { return p.joined; }).length + '/' + cat.length + '</span></button>'
    + '<button class="tab ' + (S.stab === 'drafts' ? 'on' : '') + '" data-act="stab" data-v="drafts">생기부 기재안 확인' + (pendingDrafts ? '<span class="cnt alert">' + pendingDrafts + '</span>' : '') + '</button></div>';
  var head = '<div class="row" style="margin-bottom:12px"><div><div class="muted small">' + esc(st.grade) + '학년 ' + esc(st.cls) + '반 ' + esc(st.num) + '번</div><div style="font-size:20px;font-weight:700">' + esc(st.sid) + ' ' + esc(st.name) + '</div></div>'
    + '<button class="btn sm right" data-act="reloadHome">↻ 새로고침</button></div>';
  var body = S.stab === 'drafts' ? studentDrafts(d) : S.stab === 'school' ? studentSchool(d) : studentActs(d, { total: total, ok: ok, issue: issue, sel: sel });
  return '<div class="wrap">' + head + tabs + body + '</div>';
}

function studentActs(d, c) {
  var acts = d.activities;
  var html = '';
  if (S.settings.studentNotice) html += '<div class="note" style="margin-bottom:12px">📌 ' + nl2br(S.settings.studentNotice) + '</div>';
  var recheck = acts.filter(function (a) { return a.changedAt && !a.check; }).length;
  if (recheck) html += '<div class="note warn" style="margin-bottom:12px">🔄 선생님이 내용을 고친 활동이 <b>' + recheck + '개</b> 있어요. 아래에서 <b>"내용이 수정됐어요"</b> 표시가 붙은 활동을 다시 확인해 주세요.</div>';
  html += '<div class="sumbar"><div class="sum"><div class="k">등록된 활동</div><div class="v">' + c.total + '</div></div>'
    + '<div class="sum"><div class="k">✓ 확인 완료</div><div class="v" style="color:var(--ok)">' + c.ok + ' <span class="small muted">/ ' + c.total + '</span></div></div>'
    + '<div class="sum"><div class="k">✎ 내용 수정 필요</div><div class="v" style="color:var(--warn)">' + c.issue + '</div></div>'
    + '<div class="sum"><div class="k">☆ 기재 희망</div><div class="v" style="color:#8a6100">' + c.sel + '</div></div></div>';
  var used = {};
  acts.forEach(function (a) { used[a.area] = (used[a.area] || 0) + 1; });
  var list = activityAreas().filter(function (a) { return used[a.key]; });
  html += '<div class="row" style="margin-top:14px"><button class="chip ' + (S.areaFilter === 'all' ? 'on' : '') + '" data-act="areaFilter" data-v="all">전체 ' + acts.length + '</button>'
    + list.map(function (a) { return '<button class="chip ' + (S.areaFilter === a.key ? 'on' : '') + '" data-act="areaFilter" data-v="' + esc(a.key) + '">' + esc(a.label) + ' ' + used[a.key] + '</button>'; }).join('') + '</div>';
  if (!acts.length) html += '<div class="card empty" style="margin-top:14px">아직 등록된 활동이 없어요.<br>[학교 활동 목록]에서 참여한 활동이 있는지 확인하고, 참여했다면 [참여했어요]로 알려 주세요.<div style="margin-top:10px"><button class="btn primary" data-act="stab" data-v="school">학교 활동 목록 보기</button></div></div>';
  list.filter(function (a) { return S.areaFilter === 'all' || S.areaFilter === a.key; }).forEach(function (a) {
    var items = acts.filter(function (x) { return x.area === a.key; });
    var selN = items.filter(function (x) { return x.select; }).length;
    html += '<div class="area-sec"><div class="hd"><h3>' + esc(a.label) + '</h3><span class="muted small">활동 ' + items.length + '개 · 기재 희망 ' + selN + '개</span>'
      + (a.limit ? '<span class="muted xs right">생기부 ' + esc(a.label) + ' 최대 ' + a.limit + '자 — 꼭 넣고 싶은 활동을 골라 주세요</span>' : '') + '</div>'
      + items.map(actCard).join('') + '</div>';
  });
  html += '<div class="card" style="margin-top:20px"><div class="row"><div><h3>빠진 활동이 있나요?</h3><div class="muted small">[학교 활동 목록]에서 참여·미참여를 확인하고 [참여했어요]로 알려 주세요. 목록에 없는 활동은 오른쪽 버튼으로 알릴 수 있어요.</div></div><div class="row right"><button class="btn" data-act="stab" data-v="school">학교 활동 목록</button><button class="btn primary" data-act="openReport">+ 목록에 없는 활동 알리기</button></div></div>';
  if (d.reports.length) {
    html += '<div style="margin-top:12px">' + d.reports.map(function (r) {
      var b = r.status === '대기' ? '<span class="badge warn">확인 대기</span>' : r.status === '반영' ? '<span class="badge ok">반영됨</span>' : '<span class="badge bad">반려</span>';
      return '<div class="side-act"><div class="row">' + b + areaBadge(r.area) + '<span class="t">' + esc(r.programName) + '</span><span class="muted xs">' + esc(r.date) + '</span>'
        + (r.status === '대기' ? '<button class="btn sm ghost right" data-act="cancelReport" data-id="' + esc(r.reportId) + '">신고 취소</button>' : '') + '</div>'
        + '<div class="small" style="margin-top:4px;white-space:pre-wrap">' + esc(r.content) + '</div>'
        + (r.memo ? '<div class="small" style="margin-top:4px;color:var(--pri)">선생님: ' + esc(r.memo) + '</div>' : '') + '</div>';
    }).join('') + '</div>';
  }
  html += '</div>';
  return html;
}

function actCard(a) {
  var noteKey = 'note_' + a.recId;
  var showNote = a.check === 'issue' || a.note || S.form['open_' + a.recId];
  var changed = a.changedAt && !a.check;
  return '<div class="act ' + esc(a.check) + '"' + (changed ? ' style="border-left-color:var(--warn)"' : '') + '><div class="row"><span class="t">' + esc(a.programName) + '</span><span class="m">' + esc([a.date, a.teacher ? '담당 ' + a.teacher : ''].filter(Boolean).join(' · ')) + '</span>'
    + (changed ? '<span class="badge warn right">🔄 내용이 수정됐어요 · 다시 확인해 주세요</span>' : '') + '</div>'
    + (a.common ? '<div class="common">' + nl2br(a.common) + '</div>' : '')
    + (a.content ? '<div class="mine"><b class="small" style="color:var(--pri)">나의 활동</b><br>' + nl2br(a.content) + '</div>' : '')
    + (a.reply ? '<div class="small" style="margin-top:8px;background:var(--priSoft);border-radius:8px;padding:6px 10px">💬 <b>선생님 답변</b> <span class="xs muted">' + esc(fmtDT(a.replyAt)) + '</span><br>' + nl2br(a.reply) + '</div>' : '')
    + '<div class="acts"><button class="tog ' + (a.check === 'ok' ? 'on-ok' : '') + '" data-act="stuCheck" data-id="' + esc(a.recId) + '" data-v="ok">✓ 맞아요</button>'
    + '<button class="tog ' + (a.check === 'issue' ? 'on-issue' : '') + '" data-act="stuCheck" data-id="' + esc(a.recId) + '" data-v="issue">✎ 내용이 달라요</button>'
    + '<button class="tog ' + (a.select ? 'on-star' : '') + '" data-act="stuSelect" data-id="' + esc(a.recId) + '">' + (a.select ? '★ 기재 희망' : '☆ 기재 희망') + '</button>'
    + (!showNote ? '<button class="tog" data-act="openNote" data-id="' + esc(a.recId) + '">💬 메모</button>' : '') + '</div>'
    + (showNote ? '<div class="notebox"><textarea class="inp" style="min-height:60px" placeholder="달라진 점, 빠진 내용, 강조하고 싶은 점 등을 적어 주세요" data-bind="' + noteKey + '">' + esc(fv(noteKey, a.note)) + '</textarea><div class="row" style="margin-top:6px"><span class="muted xs">' + (a.note ? '저장된 메모가 있어요' : '') + '</span><button class="btn sm right" data-act="saveNote" data-id="' + esc(a.recId) + '">메모 저장</button></div></div>' : '')
    + '</div>';
}

function studentSchool(d) {
  var cat = d.catalog || [];
  var joined = cat.filter(function (p) { return p.joined; }).length;
  var pending = cat.filter(function (p) { return !p.joined && p.report && p.report.status === '대기'; }).length;
  var notJoined = cat.length - joined - pending;
  var f = S.schoolFilter || 'all';
  var html = '<div class="note" style="margin-bottom:12px">📋 우리 학교에서 ' + esc(d.student.grade) + '학년을 대상으로 한 활동이에요. <b>참여했는데 "미참여"로 되어 있으면 [참여했어요]를 눌러</b> 무엇을 했는지 적어 주세요. 담임선생님이 확인한 뒤 반영해요.</div>'
    + '<div class="sumbar" style="margin-bottom:12px"><div class="sum"><div class="k">✓ 참여</div><div class="v" style="color:var(--ok)">' + joined + '</div></div><div class="sum"><div class="k">⏳ 알림 보냄 (확인 대기)</div><div class="v" style="color:var(--warn)">' + pending + '</div></div><div class="sum"><div class="k">미참여</div><div class="v">' + notJoined + '</div></div></div>'
    + '<div class="row" style="margin-bottom:10px"><button class="chip ' + (f === 'all' ? 'on' : '') + '" data-act="schoolFilter" data-v="all">전체 ' + cat.length + '</button><button class="chip ' + (f === 'no' ? 'on' : '') + '" data-act="schoolFilter" data-v="no">미참여만 ' + notJoined + '</button><button class="chip ' + (f === 'yes' ? 'on' : '') + '" data-act="schoolFilter" data-v="yes">참여만 ' + joined + '</button></div>';
  var list = cat.filter(function (p) {
    var pend = !p.joined && p.report && p.report.status === '대기';
    return f === 'all' || (f === 'yes' && p.joined) || (f === 'no' && !p.joined && !pend);
  });
  if (!cat.length) return html + '<div class="card empty">등록된 학교 활동이 없어요.</div>';
  if (!list.length) return html + '<div class="card empty">해당하는 활동이 없어요.</div>';
  html += '<div class="tbl-wrap"><table class="t"><tbody>' + list.map(function (p) {
    var st;
    if (p.joined) st = '<span class="badge ok">✓ 참여</span>';
    else if (p.report && p.report.status === '대기') st = '<span class="badge warn">⏳ 알림 보냄 · 확인 대기</span>';
    else if (p.report && p.report.status === '반려') st = '<span class="badge bad">반려됨</span>' + (p.report.memo ? '<div class="xs" style="margin-top:4px;color:var(--bad)">선생님: ' + esc(p.report.memo) + '</div>' : '');
    else st = '<span class="badge">미참여</span>';
    var btn = (!p.joined && !(p.report && p.report.status === '대기')) ? '<button class="btn sm primary" data-act="joinReport" data-id="' + esc(p.programId) + '">' + (p.report && p.report.status === '반려' ? '다시 알리기' : '참여했어요') + '</button>' : '';
    return '<tr><td style="width:1%">' + areaBadge(p.area) + '</td><td><b>' + esc(p.name) + '</b>' + (p.date ? '<div class="xs muted">' + esc(p.date) + '</div>' : '') + '</td><td class="nowrap">' + st + '</td><td class="nowrap" style="text-align:right">' + btn + '</td></tr>';
  }).join('') + '</tbody></table></div>';
  html += '<div class="row" style="margin-top:12px"><span class="muted small">목록에 없는 활동에 참여했나요?</span><button class="btn sm" data-act="openReport">+ 목록에 없는 활동 알리기</button></div>';
  return html;
}
ACT.schoolFilter = function (el) { S.schoolFilter = el.dataset.v; render(); };
ACT.joinReport = function (el) {
  var p = (S.home.catalog || []).filter(function (x) { return x.programId === el.dataset.id; })[0];
  if (!p) return;
  openModal({
    title: '참여했어요 — ' + p.name,
    body: '<div class="stack"><div class="row">' + areaBadge(p.area) + '<b>' + esc(p.name) + '</b></div>'
      + '<div><label class="f">날짜 / 기간 (알면)</label><input class="inp" name="date" value="' + esc(p.date || '') + '"></div>'
      + '<div><label class="f">내가 한 활동 *</label><textarea class="inp" name="content" placeholder="언제, 어떤 역할로, 무엇을 했는지 사실 위주로 적어 주세요."></textarea></div>'
      + '<div class="hint">담임선생님이 담당 선생님 명단 등으로 확인한 뒤 반영해요.</div></div>',
    buttons: [{ label: '취소', value: null }, { label: '알리기', value: true, primary: true }],
    onOk: function (f) {
      if (!f.content.trim()) return '내가 한 활동을 적어 주세요.';
      return call('studentReport', { programId: p.programId, date: f.date, content: f.content }).then(function () { toast('담임선생님께 알렸어요.', 'ok'); ACT.reloadHome(); });
    },
  });
};

function findAct(id) { return S.home.activities.filter(function (a) { return a.recId === id; })[0]; }
ACT.stab = function (el) { S.stab = el.dataset.v; store('ak_stab', S.stab); render(); };
ACT.areaFilter = function (el) { S.areaFilter = el.dataset.v; render(); };
ACT.reloadHome = function () { call('studentHome').then(function (r) { S.home = r; S.settings = r.settings; render(); toast('최신 내용으로 불러왔어요.'); }).catch(fail); };
ACT.openNote = function (el) { S.form['open_' + el.dataset.id] = true; render(); };
ACT.stuCheck = function (el) {
  var a = findAct(el.dataset.id); if (!a) return;
  var v = a.check === el.dataset.v ? '' : el.dataset.v;
  var prev = a.check; a.check = v; render();
  call('studentUpdateRecord', { recId: a.recId, check: v }).catch(function (e) { a.check = prev; render(); fail(e); });
};
ACT.stuSelect = function (el) {
  var a = findAct(el.dataset.id); if (!a) return;
  var prev = a.select; a.select = !a.select; render();
  call('studentUpdateRecord', { recId: a.recId, select: a.select }).catch(function (e) { a.select = prev; render(); fail(e); });
};
ACT.saveNote = function (el) {
  var a = findAct(el.dataset.id); if (!a) return;
  var v = fv('note_' + a.recId, a.note);
  call('studentUpdateRecord', { recId: a.recId, note: v }).then(function () { a.note = v; toast('메모를 저장했어요.', 'ok'); render(); }).catch(fail);
};
ACT.openReport = function () {
  var cat = ((S.home && S.home.catalog) || []).filter(function (p) { return !p.joined && !(p.report && p.report.status === '대기'); });
  var groups = activityAreas().filter(function (a) { return cat.some(function (p) { return p.area === a.key; }); });
  openModal({
    title: '목록에 없는 활동 알리기',
    body: '<div class="stack"><div><label class="f">어떤 활동인가요? *</label><select class="inp" name="programId"><option value="">— 학교 활동 목록에서 고르기 —</option>'
      + groups.map(function (a) { return '<optgroup label="' + esc(a.label) + '">' + cat.filter(function (p) { return p.area === a.key; }).map(function (p) { return '<option value="' + esc(p.programId) + '">' + esc(p.name) + '</option>'; }).join('') + '</optgroup>'; }).join('')
      + '<option value="_other">목록에 없는 활동 (직접 입력)</option></select><div class="hint">내 학년이 대상인 활동 중, 아직 내 목록에 없는 것만 보여요.</div></div>'
      + '<div data-part="free" class="hide stack"><div><label class="f">활동 이름 *</label><input class="inp" name="programName" placeholder="예: 과학 탐구 발표회"></div>'
      + '<div><label class="f">영역 (모르면 비워 두세요)</label><select class="inp" name="area">' + areaOptions('', true) + '</select></div></div>'
      + '<div><label class="f">날짜 / 기간</label><input class="inp" name="date" placeholder="예: 2026-07-15"></div>'
      + '<div><label class="f">내가 한 활동 *</label><textarea class="inp" name="content" placeholder="어떤 역할을 맡았고, 무엇을 했는지 사실 위주로 적어 주세요."></textarea></div></div>',
    buttons: [{ label: '취소', value: null }, { label: '신고하기', value: true, primary: true }],
    onOpen: function (w) { $('[name=programId]', w).addEventListener('change', function (e) { $('[data-part=free]', w).classList.toggle('hide', e.target.value !== '_other'); }); },
    onOk: function (f) {
      if (!f.programId) return '활동을 고르거나 [목록에 없는 활동]을 선택하세요.';
      var d = { date: f.date, content: f.content };
      if (f.programId === '_other') { if (!f.programName.trim()) return '활동 이름을 입력하세요.'; d.programName = f.programName; d.area = f.area; }
      else d.programId = f.programId;
      return call('studentReport', d).then(function () { toast('신고했어요. 담임선생님이 확인할 거예요.', 'ok'); ACT.reloadHome(); });
    },
  });
};
ACT.cancelReport = function (el) {
  confirmBox('이 신고를 취소할까요?', '신고 취소', true).then(function (ok) {
    if (ok) call('studentCancelReport', { reportId: el.dataset.id }).then(function () { ACT.reloadHome(); }).catch(fail);
  });
};

function studentDrafts(d) {
  var html = '';
  if (S.settings.commentGuide) html += '<div class="note" style="margin-bottom:14px">✍️ ' + nl2br(S.settings.commentGuide) + '</div>';
  draftAreas().forEach(function (a) {
    var x = d.drafts[a.key] || { versions: [], comments: [], status: '' };
    var vs = x.versions;
    var cur = vs[vs.length - 1];
    html += '<div class="card draft"><div class="hd">' + areaBadge(a.key) + '<h3>' + esc(a.label) + '</h3>' + statusBadge(cur ? x.status : '', true)
      + (cur ? '<span class="muted xs right">' + vs.length + '번째 공개본 · ' + esc(fmtDT(cur.createdAt)) + '</span>' : '') + '</div>';
    if (!cur) { html += '<div class="muted">담임선생님이 아직 기재안을 공개하지 않았어요. 공개되면 여기에서 확인할 수 있어요.</div></div>'; return; }
    var isFinal = x.status === '최종확정';
    html += (isFinal ? '<div class="note" style="margin-bottom:8px;background:var(--okSoft);border-color:#bfe3cb;color:#14532d">✅ 최종본으로 확정되었습니다' + (x.finalAt ? ' (' + esc(fmtDT(x.finalAt)) + ')' : '') + '. 이 내용이 생활기록부에 입력됩니다.</div>' : '')
      + '<div class="draft-text ' + (isFinal ? 'final' : '') + '">' + nl2br(cur.content) + '</div>' + meter(cur.content, a.limit);
    if (vs.length > 1) {
      var open = S.openDiff[a.key];
      html += '<div style="margin-top:8px"><button class="btn sm" data-act="toggleDiff" data-area="' + esc(a.key) + '">' + (open ? '비교 닫기' : '이전 버전과 달라진 부분 보기') + '</button></div>';
      if (open) {
        var from = +fv('sdiff_' + a.key, vs.length - 1);
        if (!(from >= 1 && from <= vs.length - 1)) from = vs.length - 1;
        var prevV = vs[from - 1];
        html += '<div class="row" style="margin:8px 0"><span class="small muted">비교할 이전 버전</span><select class="inp" style="width:auto" data-bind="sdiff_' + esc(a.key) + '" data-change="rerender">'

function draftEditor(st, a, x) {
  var vs = x.versions || [];

  var key = 'draft_' + st.sid + '_' + a.key;
  var text = fv(key, last ? last.content : '');
  var isFinal = x.status === '최종확정';
  var unpub = last && !last.pub;
  var openReq = (x.comments || []).filter(function (c) { return c.type === 'student' && !c.resolved; }).length;
  var html = '<div class="card"><div class="row" style="margin-bottom:8px"><h3>' + esc(a.label) + ' 기재안</h3>' + statusBadge(last ? x.status : '') + (last ? '<span class="muted xs">v' + last.v + (unpub ? ' (학생 비공개)' : '') + '</span>' : '')
    + (x.okAt && x.status === '학생확인' ? '<span class="muted xs">학생 확인 ' + esc(fmtDT(x.okAt)) + '</span>' : '') + '</div>';
  if (isFinal) {
    html += '<div class="note" style="margin-bottom:8px;background:var(--okSoft);border-color:#bfe3cb;color:#14532d">✅ 최종 확정 (' + esc(fmtDT(x.finalAt)) + ', ' + esc(x.finalBy) + ') — 수정하려면 확정을 해제하세요.</div>'
      + '<div class="draft-text final">' + nl2br(last.content) + '</div>' + meter(last.content, a.limit)
      + '<div class="row" style="margin-top:10px"><button class="btn sm" data-act="copyText" data-key="' + esc(key) + '">📋 복사</button><button class="btn sm danger right" data-act="unfinalize" data-area="' + esc(a.key) + '">확정 해제</button></div>';
  } else {
    html += '<textarea class="inp" style="min-height:220px" data-bind="' + esc(key) + '" data-meter="mt_' + esc(a.key) + '" data-limit="' + (a.limit || 0) + '" placeholder="교사의 관찰을 바탕으로 작성하세요.">' + esc(text) + '</textarea>'
      + '<div id="mt_' + esc(a.key) + '">' + meter(text, a.limit) + '</div>'
      + '<div class="grid2" style="margin-top:8px"><input class="inp" placeholder="수정 메모 (선택, 예: 학생 요청 반영)" data-bind="memo_' + esc(key) + '" value="' + esc(fv('memo_' + key)) + '"></div>'
      + '<div class="row" style="margin-top:10px"><button class="btn" data-act="saveDraft" data-area="' + esc(a.key) + '">임시 저장 (비공개)</button>'
      + '<button class="btn primary" data-act="saveDraft" data-area="' + esc(a.key) + '" data-pub="1">저장 후 학생에게 검토 요청</button>'
      + (last ? '<button class="btn ok right" data-act="finalize" data-area="' + esc(a.key) + '">최종 확정</button>' : '') + '</div>'
      + (openReq ? '<div class="note warn" style="margin-top:10px">학생의 수정 요청 ' + openReq + '건이 있습니다. 반영 후 [반영 완료]를 눌러 주세요.</div>' : '');
  }
  if (vs.length) {
    html += '<div class="vlist">' + vs.slice().reverse().map(function (v) {
      return '<div class="v"><b>v' + v.v + '</b><span class="muted">' + esc(fmtDT(v.createdAt)) + '</span>' + (v.pub ? '<span class="badge pri">공개</span>' : '<span class="badge">비공개</span>') + '<span class="muted xs">' + esc(v.memo || '') + '</span>'
        + '<span class="right muted xs">' + AK.charCount(v.content) + '자</span>' + (v.v > 1 ? '<button class="btn sm ghost" data-act="showDiff" data-area="' + esc(a.key) + '" data-v="' + v.v + '">비교</button>' : '') + (!isFinal ? '<button class="btn sm ghost" data-act="loadVersion" data-area="' + esc(a.key) + '" data-v="' + v.v + '">불러오기</button>' : '') + '</div>';
    }).join('') + '</div>';
  }
  html += '<div class="thread"><div class="row"><b class="small">학생과 주고받은 의견</b></div>' + ((x.comments || []).length ? x.comments.map(function (c) {
    return commentHtml(c) + (c.type === 'student' ? '<div class="row" style="margin:-4px 0 6px"><button class="btn sm ghost" data-act="resolveCmt" data-id="' + esc(c.id) + '" data-r="' + (c.resolved ? '0' : '1') + '">' + (c.resolved ? '↺ 반영 취소' : '✓ 반영 완료') + '</button></div>' : '');
  }).join('') : '<div class="muted small" style="margin:6px 0">아직 의견이 없습니다.</div>')
    + '<div class="row" style="margin-top:6px"><input class="inp grow" style="flex:1" placeholder="학생에게 답변/안내 남기기" data-bind="tc_' + esc(key) + '" value="' + esc(fv('tc_' + key)) + '"><button class="btn sm" data-act="teacherCmt" data-area="' + esc(a.key) + '">보내기</button></div></div>';
  return html + '</div>';
}

ACT.showDiff = function (el) {

ACT.finalize = function (el) {

  };

    title: '명렬표 올리기', wide: true,
    body: '<div class="note" style="margin-bottom:10px">첫 줄에 <b>학번, 이름, 생년월일, 휴대전화</b> 열 제목이 있어야 합니다. (학년·반·번호 열이 따로 있어도 됩니다)<br>생년월일·휴대전화는 전체가 적혀 있어도 되며, 저장은 <b>생년월일 6자리와 휴대전화 뒷번호 4자리만</b> 합니다. 이미 있는 학번은 정보가 갱신되고, 비밀번호는 그대로 유지됩니다.'
      + (isAdmin() ? '' : '<br>담임 선생님은 본인 학급(' + esc(o.grade) + '학년 ' + esc(o.cls) + '반) 학생만 올릴 수 있습니다.') + '</div>'
      + '<div class="row" style="margin-bottom:10px"><b class="small">① 양식이 필요하면</b><button class="btn sm" type="button" id="rosterTpl">⬇ 엑셀 양식 내려받기' + (isAdmin() ? '' : ' (' + esc(o.grade) + '-' + esc(o.cls) + ', 번호까지 채워짐)') + '</button></div>'
      + '<div class="small b" style="margin-bottom:6px">② 작성한 파일을 끌어다 놓거나 눌러서 선택</div>'
      + '<label class="drop" id="rosterDrop" style="padding:18px"><input type="file" accept=".xlsx,.xls,.csv" id="rosterFile" style="display:none"><div style="font-size:24px">📥</div><b>명렬표 엑셀 파일을 여기에 끌어다 놓으세요</b><div class="muted small" id="rosterName">또는 눌러서 파일 선택 (xlsx · xls · csv)</div></label>'
      + '<details style="margin-top:10px"><summary class="small" style="cursor:pointer">또는 엑셀에서 표를 복사해 붙여넣기</summary><textarea class="inp" id="rosterPaste" style="margin-top:6px;min-height:90px" placeholder="열 제목 줄까지 함께 복사해 붙여넣으세요 (Ctrl+V)"></textarea></details>'

    buttons: [{ label: '취소', value: null }, { label: '등록하기', value: true, primary: true }],

function loadPrograms() { return call('listPrograms').then(function (r) { S.programs = r.programs; S.settings = r.settings; render(); }).catch(fail); }
function progLabel(p) { return p.name + ' [' + areaOf(p.area).label + (p.grades ? ' · ' + AK.gradesLabel(p.grades) : '') + ']'; }

  html += '<div class="row" style="margin-bottom:10px"><button class="chip ' + (!fa ? 'on' : '') + '" data-act="pgArea" data-v="">전체 ' + p.length + '</button>'

  if (!list.length) return html + '<div class="card empty">해당하는 활동이 없습니다. [+ 활동 추가]로 넣을 수 있어요.</div>';
  html += '<div class="tbl-wrap"><table class="t"><thead><tr><th>활동명</th><th>대상</th><th>기록 영역</th><th>일자 · 담당</th><th class="c">참여<br><span class="xs muted">전체</span></th>' + (isAdmin() ? '' : '<th class="c">참여<br><span class="xs muted">우리 반</span></th>') + '<th>비고</th><th></th></tr></thead><tbody>'
    + list.map(function (x) {
      return '<tr><td><b>' + esc(x.name) + '</b>' + (x.common ? '<div class="xs muted" style="max-width:340px;white-space:pre-wrap">' + esc(x.common.slice(0, 100)) + (x.common.length > 100 ? '…' : '') + '</div>' : '') + '</td>'

        + '<td class="c">' + x.count + '</td>' + (isAdmin() ? '' : '<td class="c">' + (x.mine || '-') + '</td>') + '<td class="small muted">' + esc(x.memo || '') + '</td>'

ACT.pgArea = function (el) { S.pgArea = el.dataset.v; render(); };
ACT.pgGrade = function (el) { S.pgGrade = el.value; render(); };

function loadLib(k) {

}
function sheetRows(ws) {
  return XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, blankrows: false }).map(function (r) { return r.map(function (c) { return AK.normCell(c); }); });
}
// 명렬표·일괄입력용: 표 목록
function fileToTables(file) {
  var ext = (file.name.split('.').pop() || '').toLowerCase();
  return Promise.all([loadLib('xlsx'), readBuf(file)]).then(function (r) {
    var buf = r[1], wb;
    if (ext === 'csv' || ext === 'txt' || ext === 'tsv') wb = XLSX.read(decodeText(buf), { type: 'string', raw: true });
    else wb = XLSX.read(buf, { type: 'array', cellDates: true });
    return wb.SheetNames.map(function (n) {
      var ws = wb.Sheets[n];
      return XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: true, blankrows: false }).map(function (row) {
        return row.map(function (c) {
          if (c instanceof Date) return c.getFullYear() + ('0' + (c.getMonth() + 1)).slice(-2) + ('0' + c.getDate()).slice(-2);
          if (typeof c === 'number') return String(c);
          return String(c == null ? '' : c);
        });
      });
    });
  });
}

// 활동 자료 파일 → doc { fileName, units:[{label, blocks}] }
function parseActivityFile(file) {
  var name = file.name, ext = (name.split('.').pop() || '').toLowerCase();
  var one = function (blocks) { return { fileName: name, units: [{ label: '', blocks: blocks }] }; };
  if (ext === 'xlsx' || ext === 'xls' || ext === 'xlsm' || ext === 'csv' || ext === 'tsv') {
    return Promise.all([loadLib('xlsx'), readBuf(file)]).then(function (r) {
      var wb = (ext === 'csv' || ext === 'tsv') ? XLSX.read(decodeText(r[1]), { type: 'string' }) : XLSX.read(r[1], { type: 'array' });
      return { fileName: name, units: wb.SheetNames.map(function (sn) { return { label: wb.SheetNames.length > 1 ? sn : '', blocks: [{ kind: 'table', rows: sheetRows(wb.Sheets[sn]) }] }; }) };
    });
  }
  if (ext === 'txt') return readBuf(file).then(function (b) { return one(AK.textToBlocks(decodeText(b))); });
  if (ext === 'docx') {
    return Promise.all([loadLib('mammoth'), readBuf(file)]).then(function (r) {
      return mammoth.convertToHtml({ arrayBuffer: r[1].buffer }).then(function (res) { return one(AK.htmlToBlocks(res.value)); });
    });
  }
  if (ext === 'hwpx') {
    return Promise.all([loadLib('jszip'), readBuf(file)]).then(function (r) {
      return JSZip.loadAsync(r[1]).then(function (zip) {
        var secs = Object.keys(zip.files).filter(function (n) { return /^Contents\/section\d+\.xml$/i.test(n); })
          .sort(function (a, b) { return parseInt(a.replace(/\D/g, ''), 10) - parseInt(b.replace(/\D/g, ''), 10); });
        if (!secs.length) throw new Error('HWPX 본문을 찾지 못했습니다.');
        return Promise.all(secs.map(function (s) { return zip.file(s).async('string'); })).then(function (xs) {
          var blocks = [];
          xs.forEach(function (x) { blocks = blocks.concat(AK.hwpxSectionToBlocks(x)); });
          return one(blocks);
        });
      });
    });
  }
  if (ext === 'hwp') {
    return Promise.all([loadLib('xlsx'), loadLib('pako'), readBuf(file)]).then(function (r) {
      return one(AK.hwpToBlocks(r[2], XLSX.CFB, function (u) { return pako.inflateRaw(u); }));
    });
  }
  if (ext === 'pdf') {
    return Promise.all([loadLib('pdf'), readBuf(file)]).then(function (r) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER;
      return pdfjsLib.getDocument({ data: r[1], cMapUrl: PDF_CMAPS, cMapPacked: true, isEvalSupported: false }).promise.then(function (pdf) {
        var rows = [], p = Promise.resolve();
        for (var i = 1; i <= pdf.numPages; i++) (function (k) {
          p = p.then(function () { return pdf.getPage(k).then(function (pg) { return pg.getTextContent(); }).then(function (tc) { rows = rows.concat(AK.pdfItemsToRows(tc.items)); }); });
        })(i);
        return p.then(function () {
          if (!rows.length) throw new Error('PDF에서 글자를 찾지 못했습니다. (스캔한 이미지 PDF는 읽을 수 없어요)');
          return one([{ kind: 'text', rows: rows }]);
        });
      });
    });
  }
  return Promise.reject(new Error('지원하지 않는 형식입니다: .' + ext + ' (xlsx, csv, docx, hwpx, hwp, pdf, txt 가능)'));
}

/* ── 상태 ── */
function initUpload() {
  S.upload = { roster: null, ix: null, cands: [], files: [], errors: [], busy: false, parts: {} };
  render();
  call('rosterForMatch').then(function (r) {
    S.upload.roster = r; S.upload.ix = AK.buildIndex(r.students); S.settings = r.settings; render();
  }).catch(fail);
}
var candSeq = 0;
function addDocs(docs) {
  var U = S.upload;
  docs.forEach(function (doc) {
    var cs = AK.analyze(doc, U.ix, areas(), U.roster.scope);
    if (!cs.length) { U.errors.push(doc.fileName + ': 명렬표의 학생을 찾지 못했습니다. (학번이나 이름이 들어 있는지 확인하세요)'); return; }
    cs.forEach(function (c) {
      c.id = 'c' + (++candSeq); c.include = true; c.open = true; c.grades = '';
      linkCatalog(c, doc.fileName);
      U.cands.push(c);
      loadPartsFor(c);
    });
  });
  render();
}
// 문서 제목·파일 이름으로 학교 활동 목록의 활동을 찾아 연결
function linkCatalog(c, fileName) {
  var progs = S.upload.roster.programs;
  var m = AK.matchPrograms(c.name, progs);
  if (!m.exact.length && !m.near.length && fileName) m = AK.matchPrograms(AK.cleanTitle(fileName), progs);
  var hits = m.exact.length ? m.exact : m.near;
  var keys = {}; hits.forEach(function (p) { keys[AK.progKey(p.name)] = 1; });
  var nk = Object.keys(keys).length;
  c.link = '';
  if (nk === 1) {
    // 학생 학년이 가장 많이 맞는 항목을 기본으로
    var best = hits[0], bestN = -1;
    hits.forEach(function (p) { var k = c.rows.filter(function (r) { var st = r.sid && S.upload.ix.bySid[r.sid]; return st && AK.gradeOk(p.grades, st.grade); }).length; if (k > bestN) { bestN = k; best = p; } });
    c.mode = 'old'; c.programId = best.programId; c.area = best.area;
    c.link = m.exact.length ? 'exact' : 'near';
  } else if (nk > 1) {
    c.mode = 'old'; c.programId = ''; c.link = 'many'; c.suggest = hits.map(function (p) { return p.programId; });
  } else c.mode = 'new';
}
// 연결된 활동(학년별 같은 이름 활동 포함)에 이미 등록된 학생 불러오기
function siblingsOf(c) {
  var U = S.upload;
  if (c.mode !== 'old' || !c.programId) return [];
  var chosen = U.roster.programs.filter(function (p) { return p.programId === c.programId; })[0];
  if (!chosen) return [];
  return U.roster.programs.filter(function (p) { return AK.progKey(p.name) === AK.progKey(chosen.name); });
}
function loadPartsFor(c) {
  var U = S.upload;
  siblingsOf(c).forEach(function (p) {
    if (U.parts[p.programId]) return;
    U.parts[p.programId] = { loading: true, map: {} };
    call('programParticipants', { programId: p.programId }).then(function (list) {
      var m = {}; list.forEach(function (x) { m[x.sid] = x.content || ''; });
      U.parts[p.programId] = { loading: false, map: m };
      render();
    }).catch(function (e) { delete U.parts[p.programId]; fail(e); });
  });
}
// 기존 기록과 비교: 학생별 새로 추가 / 내용 변경 / 변경 없음 + 이번 파일에 없는 기존 참여 학생
function compareOf(c) {
  var U = S.upload, sibs = siblingsOf(c);
  if (!sibs.length) return null;
  if (sibs.some(function (p) { return !U.parts[p.programId] || U.parts[p.programId].loading; })) return { loading: true };
  var rt = routeOf(c), by = {}, cnt = { 'new': 0, changed: 0, same: 0 };
  rt.groups.forEach(function (g) {
    var m = U.parts[g.program.programId].map;
    g.records.forEach(function (r) {
      var old = m[r.sid], st;
      if (old === undefined) st = 'new';
      else if (r.content && r.content.trim() !== String(old).trim()) st = 'changed';
      else st = 'same';
      by[r.sid] = { st: st, old: old };
      cnt[st]++;
    });
  });
  var inFile = {};
  c.rows.forEach(function (r) { if (r.sid) inFile[r.sid] = 1; });
  var missing = [];
  sibs.forEach(function (p) {
    Object.keys(U.parts[p.programId].map).forEach(function (sid) { if (!inFile[sid]) missing.push({ programId: p.programId, sid: sid, content: U.parts[p.programId].map[sid] }); });
  });
  return { by: by, cnt: cnt, missing: missing };
}

function routeOf(c) {
  var U = S.upload;
  var recs = AK.mergeRecords(c.rows.filter(function (r) { return r.include && r.sid && r.status !== 'other'; }));
  var chosen = c.mode === 'old' && c.programId ? U.roster.programs.filter(function (p) { return p.programId === c.programId; })[0] : null;
  if (!chosen) {
    var out = c.grades ? recs.filter(function (r) { var st = U.ix.bySid[r.sid]; return st && !AK.gradeOk(c.grades, st.grade); }).map(function (r) { return r.sid; }) : [];
    return { groups: [{ program: null, records: recs }], outside: out, recs: recs };
  }
  var rt = AK.routeRecords(recs, chosen, U.roster.programs, U.ix.bySid);
  rt.recs = recs;
  return rt;
}

function handleFiles(list) {
  var U = S.upload;
  if (!U || !U.ix) return toast('명렬표를 불러오는 중입니다. 잠시 후 다시 시도하세요.', 'err');
  var files = Array.prototype.slice.call(list || []);
  if (!files.length) return;
  U.busy = true; render();
  var docs = [], p = Promise.resolve();
  files.forEach(function (f) {
    p = p.then(function () { return parseActivityFile(f).then(function (d) { docs.push(d); U.files.push(f.name); }, function (e) { U.errors.push(f.name + ': ' + e.message); }); });
  });
  p.then(function () { U.busy = false; addDocs(docs); });
}

    html += '<div class="row" style="margin-top:16px"><b>대조 결과 ' + U.cands.length + '개 프로그램</b><span class="muted small">저장할 학생 기록 ' + tot + '건</span><button class="btn sm ghost right" data-act="clearCands">모두 지우기</button><button class="btn primary" data-act="saveUpload">선택한 항목 저장</button></div>'

}

var ST_LAB = { ok: ['매칭', 'st-ok'], fixed: ['직접 선택', 'st-ok'], mismatch: ['학번·이름 다름', 'st-warn'], ambiguous: ['동명이인 선택', 'st-warn'], none: ['미매칭', 'st-bad'], unknown: ['명렬표에 없음', 'st-bad'], other: ['타 학급', 'st-mute'] };
function candHtml(c) {
  var U = S.upload, sc = U.roster.scope;
  var cnt = {}; c.rows.forEach(function (r) { cnt[r.status] = (cnt[r.status] || 0) + 1; });
  var inc = c.rows.filter(function (r) { return r.include && r.sid; }).length;
  var progs = U.roster.programs;
  var tb = c.tables.filter(function (t) { return c.rows.some(function (r) { return r.table === t; }); });
  var html = '<div class="card cand ' + (c.include ? '' : 'off') + '"><div class="row"><label class="row"><input type="checkbox" data-change="candInc" data-id="' + c.id + '"' + (c.include ? ' checked' : '') + '> <b>' + esc(c.name || '(이름 없음)') + '</b></label>'

    + '<span class="right small"><span class="st-ok">매칭 ' + ((cnt.ok || 0) + (cnt.fixed || 0)) + '</span>' + (cnt.mismatch ? ' · <span class="st-warn">확인 ' + cnt.mismatch + '</span>' : '') + (cnt.ambiguous ? ' · <span class="st-warn">동명이인 ' + cnt.ambiguous + '</span>' : '') + ((cnt.none || 0) + (cnt.unknown || 0) ? ' · <span class="st-bad">미매칭 ' + ((cnt.none || 0) + (cnt.unknown || 0)) + '</span>' : '') + (cnt.other ? ' · <span class="st-mute">타 학급 ' + cnt.other + '</span>' : '') + ' · 저장 ' + inc + '명</span>'
    + '<button class="btn sm ghost" data-act="candToggle" data-id="' + c.id + '">' + (c.open ? '접기' : '펼치기') + '</button></div>';
  if (!c.open) return html + '</div>';
  var sug = c.suggest || [];
  html += '<div class="row" style="margin-top:10px"><label class="row small"><input type="radio" name="mode_' + c.id + '" value="old" data-change="candMode" data-id="' + c.id + '"' + (c.mode === 'old' ? ' checked' : '') + '> 학교 활동 목록의 활동으로 저장</label>'
    + '<label class="row small"><input type="radio" name="mode_' + c.id + '" value="new" data-change="candMode" data-id="' + c.id + '"' + (c.mode === 'new' ? ' checked' : '') + '> 목록에 없는 새 활동</label>'
    + (c.mode === 'old' ? '<select class="inp" style="width:auto;max-width:460px" data-change="candProg" data-id="' + c.id + '"><option value="">— 활동 선택 —</option>'
      + (sug.length ? '<optgroup label="이름이 비슷한 활동">' + sortProgs(progs.filter(function (p) { return sug.indexOf(p.programId) >= 0; })).map(function (p) { return '<option value="' + esc(p.programId) + '"' + (p.programId === c.programId ? ' selected' : '') + '>' + esc(progLabel(p)) + '</option>'; }).join('') + '</optgroup><optgroup label="전체 목록">' : '')
      + sortProgs(progs).map(function (p) { return '<option value="' + esc(p.programId) + '"' + (p.programId === c.programId && !sug.length ? ' selected' : '') + '>' + esc(progLabel(p)) + '</option>'; }).join('') + (sug.length ? '</optgroup>' : '') + '</select>' : '') + '</div>';
  if (c.mode === 'old') {
    if (c.link === 'exact' && c.programId) html += '<div class="small" style="margin-top:6px;color:var(--ok)">✓ 학교 활동 목록의 활동과 자동으로 연결했습니다.</div>';
    else if (c.link === 'near' && c.programId) html += '<div class="small" style="margin-top:6px;color:var(--warn)">이름이 비슷한 활동과 연결했습니다. 맞는지 확인해 주세요. (문서 제목: ' + esc(c.name) + ')</div>';
    else if (c.link === 'many' && !c.programId) html += '<div class="small" style="margin-top:6px;color:var(--warn)">이름이 비슷한 활동이 여러 개입니다. 어느 활동인지 골라 주세요. (문서 제목: ' + esc(c.name) + ')</div>';
    else if (!c.programId) html += '<div class="small st-bad" style="margin-top:6px">저장할 활동을 고르세요.</div>';
    var rt = routeOf(c);
    if (rt.groups.length > 1) html += '<div class="note" style="margin-top:8px">학년마다 기록 영역이 다른 활동이라 나눠서 저장합니다: ' + rt.groups.map(function (g) { return '<b>' + esc(AK.gradesLabel(g.program.grades)) + ' ' + g.records.length + '명</b> → ' + esc(areaOf(g.program.area).label); }).join(' · ') + '</div>';
    if (rt.outside.length) html += '<div class="note warn" style="margin-top:8px">이 활동의 대상 학년이 아닌 학생 ' + rt.outside.length + '명이 들어 있습니다. 맞는지 확인하세요.</div>';
    var cmp = compareOf(c);

    else if (cmp) {
      html += '<div class="row small" style="margin-top:8px"><b>기존 기록과 비교</b><span class="badge pri">새로 추가 ' + cmp.cnt['new'] + '</span><span class="badge warn">내용 변경 ' + cmp.cnt.changed + '</span><span class="badge">변경 없음 ' + cmp.cnt.same + '</span>'
        + (cmp.cnt.changed ? '<span class="xs muted">내용이 바뀐 학생은 학생이 다시 확인하도록 ✓ 표시가 풀립니다.</span>' : '') + '</div>';
      if (cmp.missing.length) {

          + '<div class="row small" style="margin:8px 0"><label class="row"><input type="checkbox" data-change="missAll" data-id="' + c.id + '"' + (selN === cmp.missing.length ? ' checked' : '') + '> 전체 선택</label><span class="xs">체크하지 않은 학생은 그대로 남습니다. 삭제하면 학생의 확인 표시·메모도 함께 지워집니다.</span></div>'
          + cmp.missing.map(function (m) {
            var st = S.upload.ix.bySid[m.sid], k = m.programId + '|' + m.sid;
            return '<label class="row small" style="margin:4px 0;align-items:flex-start"><input type="checkbox" data-change="missOne" data-id="' + c.id + '" data-k="' + esc(k) + '"' + (c.removeSel[k] ? ' checked' : '') + '> <span><b>' + esc(st ? st.sid + ' ' + st.name : m.sid) + '</b> <span class="muted">' + esc((m.content || '(개별 내용 없음)').slice(0, 80)) + '</span></span></label>';
          }).join('') + '</details>';
      }
    }
  }
  if (c.mode === 'new') {
    html += '<div class="grid3" style="margin-top:10px"><div style="grid-column:span 1"><label class="f">프로그램 이름</label><input class="inp" data-cf="name" data-id="' + c.id + '" value="' + esc(c.name) + '"></div>'
      + '<div><label class="f">기록 영역 ' + (c.area ? '' : '<b class="st-bad">· 선택 필요</b>') + '</label><select class="inp" data-cf="area" data-id="' + c.id + '" data-change="rerender">' + areaOptions(c.area, true) + '</select></div>'
      + '<div class="grid2" style="gap:8px"><div><label class="f">일자</label><input class="inp" data-cf="date" data-id="' + c.id + '" value="' + esc(c.date) + '"></div><div><label class="f">담당교사</label><input class="inp" data-cf="teacher" data-id="' + c.id + '" value="' + esc(c.teacher) + '"></div></div></div>'
      + '<div class="row" style="margin-top:8px"><span class="f" style="margin:0">기록 대상 학년</span>' + ['1', '2', '3'].map(function (g) { return '<label class="row small"><input type="checkbox" data-change="candGrade" data-id="' + c.id + '" data-g="' + g + '"' + (c.grades && c.grades.split(',').indexOf(g) >= 0 ? ' checked' : '') + '> ' + g + '학년</label>'; }).join('') + '<span class="xs muted">(안 고르면 전체 학년 · 새 활동은 학교 활동 목록에도 추가됩니다)</span></div>'
      + '<div style="margin-top:8px"><label class="f">공통 활동 내용 (참여 학생 모두에게 함께 보임)</label><textarea class="inp" style="min-height:56px" data-cf="common" data-id="' + c.id + '">' + esc(c.common) + '</textarea></div>';
  }
  tb.forEach(function (t, ti) {
    html += '<div class="small muted" style="margin-top:10px">표' + (tb.length > 1 ? ' ' + (ti + 1) : '') + '에서 <b>개별 활동 내용</b>으로 쓸 열:</div><div class="colchips">' + t.labels.map(function (lab, i) {
      if (!lab || ['sid', 'name', 'grade', 'cls', 'num', 'gcn', 'seq'].indexOf(t.roles[i]) >= 0) return '';
      var on = t.contentCols.indexOf(i) >= 0;
      return '<button class="chip ' + (on ? 'on' : '') + '" data-act="toggleCol" data-id="' + c.id + '" data-t="' + ti + '" data-i="' + i + '">' + esc(lab) + '</button>';
    }).join('') + '</div>';
  });
  var dl = 'dl_' + c.id;
  var pool = sc.role === 'teacher' ? U.roster.students.filter(function (s) { return s.grade === sc.grade && s.cls === sc.cls; }) : U.roster.students;
  html += '<datalist id="' + dl + '">' + pool.map(function (s) { return '<option value="' + esc(s.sid + ' ' + s.name) + '">' + esc(s.grade + '-' + s.cls + '-' + s.num) + '</option>'; }).join('') + '</datalist>';
  var cmpAll = compareOf(c);
  if (cmpAll && cmpAll.loading) cmpAll = null;
  html += '<div class="rows tbl-wrap" data-scroll="rows_' + c.id + '"><table class="t"><thead><tr><th class="c">저장</th><th>학생</th><th>상태</th><th style="min-width:260px">개별 활동 내용</th><th>원본</th></tr></thead><tbody>'
    + c.rows.map(function (r, i) {
      var s = r.sid ? U.ix.bySid[r.sid] : null;
      var lab = ST_LAB[r.status] || [r.status, ''];
      var cmpR = cmpAll && r.sid && r.include ? cmpAll.by[r.sid] : null;
      var cmpB = cmpR ? (cmpR.st === 'new' ? '<span class="badge pri">새로 추가</span>' : cmpR.st === 'changed' ? '<span class="badge warn">내용 변경</span>' : '<span class="badge">변경 없음</span>') : '';
      var who;
      if (r.status === 'ambiguous') who = '<select class="inp" style="min-width:170px" data-change="rowPick" data-id="' + c.id + '" data-i="' + i + '"><option value="">— 선택 —</option>' + r.options.map(function (sid) { var x = U.ix.bySid[sid]; return '<option value="' + esc(sid) + '"' + (sid === r.sid ? ' selected' : '') + '>' + esc(x.sid + ' ' + x.name) + '</option>'; }).join('') + '</select>';
      else if (r.status === 'none' || r.status === 'unknown' || r.status === 'fixed') who = '<input class="inp" style="min-width:150px" list="' + dl + '" placeholder="학번 또는 이름" data-change="rowSet" data-id="' + c.id + '" data-i="' + i + '" value="' + esc(s ? s.sid + ' ' + s.name : '') + '">';
      else who = s ? '<b class="nowrap">' + esc(s.sid) + ' ' + esc(s.name) + '</b><div class="xs muted">' + esc(s.grade + '학년 ' + s.cls + '반 ' + s.num + '번') + '</div>' : '-';
      return '<tr><td class="c"><input type="checkbox" data-change="rowInc" data-id="' + c.id + '" data-i="' + i + '"' + (r.include ? ' checked' : '') + (r.status === 'other' ? ' disabled' : '') + '></td><td>' + who + '</td>'
        + '<td class="small nowrap ' + lab[1] + '">' + esc(lab[0]) + (r.hint ? '<div class="xs muted">' + esc(r.hint) + '</div>' : '') + (cmpB ? '<div style="margin-top:4px">' + cmpB + '</div>' : '') + '</td>'
        + '<td><textarea class="inp" data-rc="' + i + '" data-id="' + c.id + '">' + esc(r.content) + '</textarea>' + (cmpR && cmpR.st === 'changed' ? '<div class="xs muted" style="margin-top:4px;white-space:pre-wrap">이전: ' + esc(String(cmpR.old || '(없음)').slice(0, 200)) + '</div>' : '') + '</td><td class="xs muted" style="max-width:260px;white-space:pre-wrap">' + esc(r.raw.slice(0, 300)) + '</td></tr>';
    }).join('') + '</tbody></table></div></div>';
  return html;
}

function cand(id) { return S.upload.cands.filter(function (c) { return c.id === id; })[0]; }
ACT.pickFiles = function (el) { handleFiles(el.files); el.value = ''; };
ACT.clearUpErr = function () { S.upload.errors = []; render(); };
ACT.clearCands = function () { confirmBox('대조 결과를 모두 지울까요? (저장하지 않은 내용은 사라집니다)', '지우기', true).then(function (ok) { if (ok) { S.upload.cands = []; S.upload.errors = []; render(); } }); };
ACT.candInc = function (el) { cand(el.dataset.id).include = el.checked; render(); };
ACT.candToggle = function (el) { var c = cand(el.dataset.id); c.open = !c.open; render(); };
ACT.candMode = function (el) { var c = cand(el.dataset.id); c.mode = el.value; c.removeSel = {}; loadPartsFor(c); render(); };
ACT.candProg = function (el) { var c = cand(el.dataset.id); c.programId = el.value; c.link = c.link === 'many' ? 'picked' : c.link; c.removeSel = {}; loadPartsFor(c); render(); };
ACT.missOne = function (el) { var c = cand(el.dataset.id); c.removeSel = c.removeSel || {}; c.removeSel[el.dataset.k] = el.checked; c.openMissing = true; render(); };
ACT.missAll = function (el) { var c = cand(el.dataset.id), cmp = compareOf(c); c.removeSel = {}; if (el.checked && cmp && cmp.missing) cmp.missing.forEach(function (m) { c.removeSel[m.programId + '|' + m.sid] = true; }); c.openMissing = true; render(); };
ACT.candGrade = function (el) {
  var c = cand(el.dataset.id), set = (c.grades ? c.grades.split(',') : []).filter(function (g) { return g !== el.dataset.g; });
  if (el.checked) set.push(el.dataset.g);
  c.grades = AK.parseGrades(set.join(','));
};
ACT.rowInc = function (el) { cand(el.dataset.id).rows[+el.dataset.i].include = el.checked; };
ACT.rowPick = function (el) { var r = cand(el.dataset.id).rows[+el.dataset.i]; r.sid = el.value; r.include = !!el.value; render(); };
ACT.rowSet = function (el) {
  var c = cand(el.dataset.id), r = c.rows[+el.dataset.i], U = S.upload, sc = U.roster.scope;
  var v = String(el.value || '').trim(), sid = (v.match(/^\d{4,6}/) || [''])[0];
  var s = sid ? AK.lookupSid(sid, U.ix) : null;
  if (!s && v) { var byN = U.ix.byName[AK.normName(v)] || []; if (sc.role === 'teacher') byN = byN.filter(function (x) { return x.grade === sc.grade && x.cls === sc.cls; }); if (byN.length === 1) s = byN[0]; }
  if (s && sc.role === 'teacher' && !(s.grade === sc.grade && s.cls === sc.cls)) { toast('담당 학급 학생만 저장할 수 있습니다.', 'err'); s = null; }
  if (s) { r.sid = s.sid; r.status = 'fixed'; r.include = true; } else { if (r.status === 'fixed') r.status = 'none'; r.sid = ''; r.include = false; if (v) toast('명렬표에서 학생을 찾지 못했습니다.', 'err'); }
  render();
};
ACT.toggleCol = function (el) {
  var c = cand(el.dataset.id);
  var tb = c.tables.filter(function (t) { return c.rows.some(function (r) { return r.table === t; }); });
  var t = tb[+el.dataset.t], i = +el.dataset.i, k = t.contentCols.indexOf(i);
  if (k >= 0) t.contentCols.splice(k, 1); else { t.contentCols.push(i); t.contentCols.sort(function (a, b) { return a - b; }); }
  S.upload.cands.forEach(function (cc) { cc.rows.forEach(function (r) { if (r.table === t) r.content = AK.rowContent(r); }); });
  render();
};
document.addEventListener('input', function (e) {
  var el = e.target;
  if (!S.upload || !el.dataset || !el.dataset.id) return;
  if (el.dataset.cf) { var c = cand(el.dataset.id); if (c) c[el.dataset.cf] = el.value; }
  if (el.dataset.rc != null) { var c2 = cand(el.dataset.id); if (c2) c2.rows[+el.dataset.rc].content = el.value; }
});
ACT.analyzePaste = function () {
  var box = $('#pastebox');
  var html = box.innerHTML, text = box.innerText;
  if (!String(text).trim()) return toast('붙여넣은 내용이 없습니다.', 'err');
  var blocks = /<table/i.test(html) ? AK.htmlToBlocks(html) : AK.textToBlocks(text);
  var nm = $('#pastename').value.trim();
  var doc = { fileName: nm || '붙여넣기', units: [{ label: '', blocks: nm ? [{ kind: 'text', rows: [[nm]] }].concat(blocks) : blocks }] };
  addDocs([doc]);
};
ACT.saveUpload = function () {
  var U = S.upload, items = [], problems = [], outsideN = 0, sum = { 'new': 0, changed: 0, same: 0, remove: 0 }, newProg = 0;
  U.cands.filter(function (c) { return c.include; }).forEach(function (c) {
    var rt = routeOf(c), cmp = compareOf(c);
    var rem = {};
    if (cmp && cmp.missing) cmp.missing.forEach(function (m) { if (c.removeSel && c.removeSel[m.programId + '|' + m.sid]) (rem[m.programId] = rem[m.programId] || []).push(m.sid); });
    var remN = Object.keys(rem).reduce(function (s2, k) { return s2 + rem[k].length; }, 0);
    if (!rt.recs.length && !remN) return;
    outsideN += rt.outside.length;
    if (c.mode === 'old') {
      if (!c.programId) { problems.push('"' + c.name + '": 학교 활동 목록에서 활동을 고르세요.'); return; }
      if (cmp && cmp.loading) { problems.push('"' + c.name + '": 기존 기록과 비교하는 중입니다. 잠시 후 다시 눌러 주세요.'); return; }
      if (cmp) { sum['new'] += cmp.cnt['new']; sum.changed += cmp.cnt.changed; sum.same += cmp.cnt.same; }
      sum.remove += remN;
      var used = {};
      rt.groups.forEach(function (g) { items.push({ programId: g.program.programId, program: { common: c.common }, records: g.records, remove: rem[g.program.programId] || [] }); used[g.program.programId] = 1; });
      Object.keys(rem).forEach(function (pid) { if (!used[pid]) items.push({ programId: pid, records: [], remove: rem[pid] }); });
    } else {
      if (!String(c.name).trim()) { problems.push(c.fileName + ': 활동 이름을 입력하세요.'); return; }
      if (!c.area) { problems.push('"' + c.name + '": 기록 영역을 선택하세요.'); return; }
      sum['new'] += rt.recs.length; newProg++;
      items.push({ program: { name: c.name, area: c.area, grades: c.grades, date: c.date, teacher: c.teacher, common: c.common, source: c.fileName + (c.label ? ' / ' + c.label : '') }, records: rt.recs });
    }
  });
  if (problems.length) return infoBox('저장 전에 확인해 주세요', '<div class="err">' + problems.map(esc).join('<br>') + '</div>');
  if (!items.length) return toast('저장할 학생 기록이 없습니다.', 'err');
  var msg = '이렇게 저장할까요?\n\n· 새로 추가: ' + sum['new'] + '명' + (newProg ? ' (새 활동 ' + newProg + '개 포함)' : '') + '\n· 내용 변경: ' + sum.changed + '명 — 학생이 다시 확인하도록 ✓ 표시가 풀립니다\n· 변경 없음: ' + sum.same + '명'
    + (sum.remove ? '\n· 삭제: ' + sum.remove + '명 (이번 파일에 없는 기존 참여 학생)' : '') + (outsideN ? '\n\n대상 학년이 아닌 학생 ' + outsideN + '명이 포함되어 있습니다.' : '');
  confirmBox(msg, '저장', sum.remove > 0).then(function (ok) {
    if (!ok) return;
    call('saveUpload', { items: items }).then(function (r) {
      infoBox('저장 완료', '<p>' + (r.programs ? '새 활동 <b>' + r.programs + '</b>개 · ' : '') + '새로 추가 <b>' + r.inserted + '</b>명 · 내용 변경 <b>' + r.changed + '</b>명 · 변경 없음 ' + r.unchanged + '명' + (r.removed ? ' · 삭제 <b>' + r.removed + '</b>명' : '') + (r.skipped ? ' · 권한 밖 제외 ' + r.skipped + '건' : '') + '</p><p class="small muted">학생들은 로그인하면 바로 확인할 수 있고, 내용이 바뀐 활동에는 "다시 확인해 주세요" 표시가 붙습니다.</p>');
      U.cands = U.cands.filter(function (c) { return !c.include; });
      U.parts = {};
      call('rosterForMatch').then(function (rr) { U.roster = rr; render(); });
      render();
    }).catch(fail);
  });
};

function afterRender() {
  var dz = document.getElementById('dropzone');
  if (dz && !dz._bound) {
    dz._bound = true;
    ['dragenter', 'dragover'].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('over'); }); });
    ['dragleave', 'drop'].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('over'); }); });
    dz.addEventListener('drop', function (e) { handleFiles(e.dataTransfer.files); });
  }
}

</script>
<script>start();</script>
</body>
